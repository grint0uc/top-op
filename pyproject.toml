[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "topop"
dynamic = ["version"]
description = "3D topology optimization tool: voxel SIMP core, FastAPI server, Three.js frontend"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pyamg",
    "trimesh",
    "rtree",
    "manifold3d",
    "scikit-image",
    "networkx",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "python-multipart",
    "websockets",
    "matplotlib",
    "mcp",
    "lxml",  # trimesh needs it to read 3MF uploads
]

[project.optional-dependencies]
accel = ["embreex"]
step = ["cadquery-ocp>=7.8"]  # STEP import via the OCC kernel only (~65 MB wheel)
examples = ["cadquery>=2.5"]  # regenerate examples/bracket.step (pulls vtk etc., dev only)

[project.scripts]
topop = "topop.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout",
    "httpx",
    "ruff",
    "openapi-spec-validator",
]

[tool.hatch.version]
path = "topop/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["topop"]
# built frontend (committed) must ship in the wheel even if an ignore rule ever covers it
artifacts = ["topop/server/static/**"]

[tool.ruff]
line-length = 100
target-version = "py312"


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests taking more than ~10 s"]
timeout = 300
