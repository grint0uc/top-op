name: Release

# Push a tag like v0.3.0, or run it by hand (Actions > Release > Run workflow) with a tag name and a branch:
# build the sdist and wheel and publish them as a GitHub release whose notes are the matching
# "## [0.3.0]" section of CHANGELOG.md. A manual run creates the tag on the chosen branch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v0.3.0"
        required: true
      target:
        description: "Branch the tag points at"
        required: true
        default: main

permissions:
  contents: write

env:
  UV_LOCKED: "1"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target || github.ref }}

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Tag matches the package version
        run: |
          tag="${TAG#v}"
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' topop/__init__.py)
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $TAG does not match topop/__init__.py version $version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Wheel ships the built frontend
        run: unzip -l dist/*.whl | grep -q 'topop/server/static/index.html'

      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]*\]: / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $version." > release-notes.md
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ inputs.target || github.sha }}
          name: top-op ${{ env.TAG }}
          body_path: release-notes.md
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            dist/*.whl
            dist/*.tar.gz
